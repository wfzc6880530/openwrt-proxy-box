name: Build IPK (ImmortalWrt 24.10 x86_64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "luci-app-proxy-box/**"
      - ".github/workflows/build-ipk.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget zstd

      - name: Download SDK
        run: |
          SDK_URL="https://downloads.immortalwrt.org/releases/24.10.5/targets/x86/64/immortalwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          wget -O sdk.tar.zst "$SDK_URL"
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          echo "SDK_DIR=$PWD/sdk" >> "$GITHUB_ENV"

      - name: Prepare package
        run: |
          mkdir -p "$SDK_DIR/package/luci-app-proxy-box"
          cp -a luci-app-proxy-box/. "$SDK_DIR/package/luci-app-proxy-box/"
          make -C "$SDK_DIR" defconfig
          make -C "$SDK_DIR" package/luci-app-proxy-box/compile V=s

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-proxy-box-ipk
          path: |
            sdk/bin/packages/x86_64/base/luci-app-proxy-box*.ipk
            sdk/bin/packages/x86_64/luci/luci-app-proxy-box*.ipk
          if-no-files-found: error
